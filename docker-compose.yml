name: vulnscan-platform

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password}
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./backend:/app
      # Claude CLI auth — same mount as worker so available_ai_providers() can probe it
      - /root/.claude:/root/.claude
    ports:
      - "${BACKEND_PORT:-8888}:8888"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8888 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Workers: separate queues run in parallel ──────────────────────
  # worker-scan   → scan jobs (can scale: --scale worker-scan=3)
  # worker-ai     → AI analysis + PoC generation
  # worker-data   → dataset refresh (NVD, KEV, EPSS, …)

  worker-scan:
    build: ./backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./backend:/app
      - ./scripts:/scripts
      - /root/.claude:/root/.claude
    command: >
      sh -c 'for i in $$(seq 1 $${SCAN_WORKERS:-1}); do
        rq worker --url $${REDIS_URL:-redis://redis:6379/0} scans &
      done; wait'
    restart: unless-stopped

  worker-ai:
    build: ./backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./backend:/app
      - ./scripts:/scripts
      - /root/.claude:/root/.claude
    command: rq worker --url ${REDIS_URL:-redis://redis:6379/0} ai
    restart: unless-stopped

  worker-data:
    build: ./backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./backend:/app
      - ./scripts:/scripts
    command: rq worker --url ${REDIS_URL:-redis://redis:6379/0} datasets
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # Browser uses same-origin relative URLs (so the page works under any public
      # hostname / TLS termination). In dev, the Vite dev server proxies them to
      # the backend container via VITE_PROXY_TARGET.
      - VITE_API_URL=
      - VITE_PROXY_TARGET=http://backend:8888
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped

volumes:
  db_data:
  neo4j_data:
